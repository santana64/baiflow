services:
  db:
    image: postgres:16-alpine
    container_name: bailflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bailflow
    ports:
      - "${POSTGRES_PORT:-55433}:5432"
    volumes:
      - bailflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bailflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bailflow-postgres-data:
